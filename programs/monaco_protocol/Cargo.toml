[package]
name = "monaco_protocol"
version = "0.16.0-dev"
description = "Culture Markets Protocol program"
edition = "2018"

[lib]
crate-type = ["cdylib", "lib"]
name = "monaco_protocol"
doctest = false

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
stable = []
dev = []
edge = []

[dependencies]
solana-program = "= 1.17.2"
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
spl-token = "4.0.0"
rust_decimal = "1.32.0"
test-case = "3.2.1"
protocol_product = { git = "https://github.com/azkevin139/culture-product.git", branch = "main", features = ["no-entrypoint"] }
